<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerald prototype</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { min-height: 100vh; font-size: 15px; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, h4 { font-family: var(--display); margin: 0; letter-spacing: -0.015em; }

  /* top nav */
  .top { position: sticky; top: 0; z-index: 20; background: rgba(251,248,241,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top-in { max-width: 1240px; margin: 0 auto; height: 68px; padding: 0 28px; display: flex; align-items: center; gap: 6px; }
  .logo { display: flex; align-items: center; gap: 10px; font: 800 21px var(--display); margin-right: 22px; }
  .logo .gem { width: 30px; height: 30px; }
  .navl { padding: 8px 13px; border-radius: 10px; font-weight: 700; color: var(--muted); font-size: 14.5px; }
  .navl.on { color: var(--emerald-ink); background: var(--emerald-soft); }
  .grow { flex: 1; }
  .search { width: 230px; height: 40px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--muted); font-size: 14px; margin-right: 8px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; position: relative; }
  .icon-btn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--rose-ink); border: 2px solid #fff; }
  .add { height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--emerald); color: #fff; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; margin: 0 8px; box-shadow: 0 2px 0 var(--emerald-ink); }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 30px 28px 80px; }
  .grid { display: grid; gap: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
  .pad { padding: 22px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .eyebrow { font: 800 12px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; }
  .between { justify-content: space-between; }
  .stack { display: flex; flex-direction: column; }

  .av { border-radius: 50%; display: grid; place-items: center; color: #fff; font-family: var(--display); font-weight: 800; flex: none; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font: 700 12.5px var(--body); padding: 4px 10px; border-radius: 99px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
  .chip.em { background: var(--emerald-soft); color: var(--emerald-ink); }
  .chip.gold { background: var(--gold-soft); color: var(--gold-ink); }
  .chip.blue { background: var(--blue-soft); color: var(--blue-ink); }
  .chip.rose { background: var(--rose-soft); color: var(--rose-ink); }
  .chip.violet { background: var(--violet-soft); color: var(--violet-ink); }
  .chip.line { background: transparent; border: 1px solid var(--line); }
  .chip.on { background: var(--ink); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .status { display: inline-flex; align-items: center; gap: 6px; font: 800 12.5px var(--body); padding: 4px 10px 4px 8px; border-radius: 99px; }
  .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .s-launched { background: var(--emerald-soft); color: var(--emerald-ink); }
  .s-building { background: var(--gold-soft); color: var(--gold-ink); }
  .s-completed { background: var(--blue-soft); color: var(--blue-ink); }
  .btn { height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; }
  .btn.pri { background: var(--emerald); border-color: var(--emerald); color: #fff; box-shadow: 0 2px 0 var(--emerald-ink); }
  .btn.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
  .btn.sm { height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
  .written { display: inline-flex; align-items: center; gap: 5px; font: 700 12px var(--body); color: var(--emerald-ink); }

  /* covers: generated, no photos */
  .cover { position: relative; overflow: hidden; border-radius: 14px; display: grid; place-items: center; }
  .cover .mock { width: 46%; aspect-ratio: 9 / 16; max-height: 82%; border-radius: 18px; background: rgba(255,255,255,.95); box-shadow: 0 18px 40px rgba(0,0,0,.18); padding: 10% 8%; display: flex; flex-direction: column; gap: 7%; transform: rotate(-6deg) translateY(8%); }
  .cover.wide .mock { aspect-ratio: 16 / 10; width: 62%; transform: rotate(-3deg) translateY(6%); border-radius: 12px; padding: 5% 5%; gap: 9%; }
  .cover .mock b { display: block; font: 800 clamp(9px, 1.25vw, 16px) var(--display); color: var(--ink); }
  .cover .mock i { display: block; height: 7%; min-height: 5px; border-radius: 4px; background: var(--c); opacity: .35; }
  .cover .mock i:nth-child(3) { width: 70%; }
  .cover .mock i.big { height: 22%; opacity: 1; border-radius: 8px; }
  .cover .glyph { position: absolute; top: 12px; left: 14px; font-size: 22px; filter: drop-shadow(0 2px 4px rgba(0,0,0,.15)); }

  /* home */
  .hello h1 { font-size: 34px; }
  .potm { display: grid; grid-template-columns: 1.05fr 1fr; overflow: hidden; border: 1px solid #e7d6ac; background: linear-gradient(135deg, #fffaf0, #fbf1da); }
  .potm .cover { border-radius: 0; height: 100%; min-height: 300px; }
  .potm .txt { padding: 28px 30px; display: flex; flex-direction: column; gap: 12px; }
  .potm h2 { font-size: 40px; line-height: 1.02; }
  .crown { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font: 800 12.5px var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--gold-ink); background: #fff; border: 1px solid #e7d6ac; padding: 5px 12px; border-radius: 99px; }
  .quote { font: 600 16.5px/1.5 var(--body); color: #3b443f; border-left: 3px solid var(--gold); padding-left: 14px; margin: 2px 0; }
  .lbrow { display: grid; grid-template-columns: 26px 34px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .lbrow:last-child { border-bottom: 0; }
  .lbrow .r { font: 800 15px var(--display); color: var(--muted); text-align: center; }
  .lbrow b { font: 800 16px var(--display); }
  .lbrow.you { background: var(--emerald-soft); margin: 0 -12px; padding: 9px 12px; border-radius: 12px; border: 0; }
  .medal1 { color: var(--gold-ink) !important; }
  .feed-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item .what { font-weight: 600; }
  .feed-item .what b { font-weight: 800; }
  .kind { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; font-size: 16px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tab { padding: 10px 14px; font-weight: 800; color: var(--muted); border-bottom: 2.5px solid transparent; margin-bottom: -1px; font-size: 14.5px; }
  .tab.on { color: var(--ink); border-color: var(--emerald); }
  .tab .n { font-weight: 700; color: var(--muted); margin-left: 4px; }
  .help { background: var(--emerald); color: #fff; border: 0; }
  .help .q { background: rgba(255,255,255,.12); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-weight: 600; }
  .help .q small { display: block; opacity: .8; font-weight: 600; margin-top: 2px; }
  .help .btn { background: #fff; color: var(--emerald-ink); border: 0; }
  .prog { height: 10px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
  .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), #e2b552); border-radius: 99px; }
  .badge { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; background: radial-gradient(circle at 35% 30%, #fff6dc, #f1d48c 75%); border: 2px solid #d9b25a; flex: none; }
  .badge.locked { filter: grayscale(1); opacity: .45; }
  .pcard { overflow: hidden; display: flex; flex-direction: column; }
  .pcard .cover { border-radius: 0; height: 150px; }
  .pcard .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .pcard h3 { font-size: 19px; }

  /* builders */
  .bcard { padding: 22px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .bcard .now { font-size: 13.5px; color: var(--muted); }
  .bcard .now b { color: var(--ink); }
  .bbadges { display: flex; gap: 4px; font-size: 17px; }

  /* profile */
  .phead { display: grid; grid-template-columns: auto 1fr auto; gap: 24px; align-items: center; padding: 28px; }
  .stat { padding: 16px 18px; border-radius: 14px; background: var(--sunk); }
  .stat b { display: block; font: 800 26px var(--display); }

  /* project */
  .ptitle { font-size: 46px; line-height: 1; }
  .learn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 26px; }
  .learn-grid h4 { font-size: 15px; margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
  .learn-grid p { margin: 0; color: #36403b; }
  .upd { display: grid; grid-template-columns: 14px 1fr; gap: 12px; padding: 8px 0; }
  .upd::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--emerald); margin-top: 6px; box-shadow: 0 0 0 4px var(--emerald-soft); }

  /* AMA */
  .qa { padding: 20px 22px; }
  .qa + .qa { border-top: 1px solid var(--line); }
  .qa .q { font: 800 18px/1.3 var(--display); }
  .ans { margin-top: 14px; margin-left: 18px; padding: 14px 16px; border-radius: 14px; background: var(--sunk); }
  .ans.helpful { background: var(--emerald-soft); }
  pre.code { margin: 10px 0 0; background: #17201b; color: #d3eadf; border-radius: 12px; padding: 14px 16px; font: 500 13px/1.6 var(--mono); overflow: hidden; white-space: pre; }
  pre.code .k { color: #8fd3b4; } pre.code .s { color: #f1cf86; } pre.code .c { color: #7d8c84; }

  /* learn */
  .post { padding: 20px 22px; display: grid; gap: 8px; }
  .post h3 { font-size: 21px; line-height: 1.2; }
  .news { display: grid; grid-template-columns: 150px 1fr; gap: 18px; padding: 18px; }
  .news .thumb { border-radius: 12px; height: 104px; background: linear-gradient(135deg, #24324a, #3d5e8f); display: grid; place-items: center; color: #fff; font: 800 13px var(--display); padding: 10px; text-align: center; }
  .take { background: var(--blue-soft); color: #23324a; border-radius: 12px; padding: 10px 12px; font-weight: 600; }

  /* snippets */
  .snip { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
  .copy { height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--ink); color: #fff; font-weight: 800; display: inline-flex; gap: 6px; align-items: center; }
  .copy.done { background: var(--emerald); }

  /* leaderboard */
  .podium { display: grid; grid-template-columns: 1fr 1.1fr 1fr; align-items: end; gap: 16px; padding: 26px 26px 0; }
  .pod { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .pod .blk { width: 100%; border-radius: 16px 16px 0 0; display: grid; place-items: center; font: 800 36px var(--display); color: #fff; }
  .bar { height: 8px; border-radius: 99px; background: var(--sunk); display: flex; overflow: hidden; }
  .bar i { display: block; height: 100%; }

  /* modal / forms */
  .scrim { position: fixed; inset: 0; background: rgba(22,32,27,.45); z-index: 40; display: grid; place-items: center; padding: 24px; }
  .modal { width: min(920px, 100%); background: var(--surface); border-radius: 22px; display: grid; grid-template-columns: 300px 1fr; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.25); }
  .opts { background: var(--sunk); padding: 22px 16px; display: flex; flex-direction: column; gap: 6px; }
  .opt { display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; font-weight: 800; }
  .opt small { display: block; font-weight: 600; color: var(--muted); font-size: 12.5px; }
  .opt .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 19px; background: #fff; }
  .opt.on { background: #fff; box-shadow: 0 0 0 2px var(--emerald); }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font: 800 13px var(--body); }
  .field .hint { font-size: 12.5px; color: var(--muted); }
  .input { border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 14px; background: #fff; font-size: 15px; min-height: 46px; }
  .input.focus { border-color: var(--emerald); box-shadow: 0 0 0 4px var(--emerald-soft); }
  .input.area { min-height: 92px; line-height: 1.55; }
  .linkprev { display: grid; grid-template-columns: 120px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 10px; align-items: center; }
  .nudge { display: grid; grid-template-columns: auto 1fr; gap: 14px; background: var(--gold-soft); border: 1px solid #e7d6ac; border-radius: 14px; padding: 14px 16px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 600; }
  .check .box { width: 22px; height: 22px; border-radius: 7px; background: var(--emerald); color: #fff; display: grid; place-items: center; flex: none; font-size: 14px; font-weight: 800; }

  .tabbar { display: none; }
  .mtop { display: none; }

  @media (max-width: 700px) {
    body { font-size: 14.5px; }
    .top { display: none; }
    .mtop { display: flex; position: sticky; top: 0; z-index: 20; height: 56px; padding: 0 16px; align-items: center; justify-content: space-between; background: rgba(251,248,241,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
    .mtop .logo { margin: 0; font-size: 19px; }
    .wrap { padding: 18px 16px 110px; }
    .grid { gap: 14px; }
    .cols, .cols2, .cols3, .cols4 { grid-template-columns: 1fr !important; }
    .hello h1 { font-size: 26px; }
    .potm { grid-template-columns: 1fr; }
    .potm .cover { min-height: 190px; }
    .potm .txt { padding: 20px; }
    .potm h2 { font-size: 30px; }
    .hide-m { display: none !important; }
    .ptitle { font-size: 34px; }
    .learn-grid { grid-template-columns: 1fr; }
    .tabs { overflow: hidden; }
    .tab { padding: 10px 10px; font-size: 13.5px; }
    .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding: 8px 6px 26px; }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; font: 700 11px var(--body); color: var(--muted); }
    .tabbar a.on { color: var(--emerald-ink); }
    .tabbar .plus span { width: 50px; height: 50px; border-radius: 50%; background: var(--emerald); color: #fff; display: grid; place-items: center; margin-top: -24px; box-shadow: 0 6px 16px rgba(15,123,90,.35), 0 0 0 5px #fff; }
    .tabbar .plus span svg { width: 24px; height: 24px; }
    .scrim { place-items: end stretch; padding: 0; }
    .modal { grid-template-columns: 1fr; border-radius: 24px 24px 0 0; }
    .modal .form { display: none; }
    .opts { background: #fff; padding: 10px 16px 34px; }
    .opts .grab { display: block !important; }
    .pcard .cover { height: 130px; }
    .phead { grid-template-columns: auto 1fr; padding: 20px; }
    .podium { padding: 18px 14px 0; gap: 8px; }
    .lbrow { grid-template-columns: 26px 34px 1fr auto !important; }
  }
</style>
</head>

  ["Admin-only middleware", "ib", "Next.js · auth · from an AMA answer", 12, `<span class="k">export function</span> middleware(req: NextRequest) {
  <span class="k">if</span> (!isAdmin(req)) {
    <span class="k">return</span> NextResponse.redirect(<span class="k">new</span> URL(<span class="s">"/"</span>, req.url))
  }
}
<span class="k">export const</span> config = { matcher: [<span class="s">"/admin/:path*"</span>] }`],
  ["Supabase RLS: owners only", "bi", "SQL · Supabase", 8, `<span class="k">alter table</span> shifts <span class="k">enable row level security</span>;
<span class="k">create policy</span> <span class="s">"owner can edit"</span> <span class="k">on</span> shifts
  <span class="k">for all using</span> (auth.uid() = volunteer_id);`],
  ["Prayer-time widget timeline", "yu", "Swift · WidgetKit · from an AMA answer", 6, `<span class="k">let</span> entries = prayers.map { p <span class="k">in</span>
  SalahEntry(date: p.time, next: p.name)
}
completion(Timeline(entries: entries, policy: .atEnd))`],
];
pages.snippets = () => shell("snippets", `

pages.leaderboard = () => {

  const cols = ["var(--emerald)", "var(--violet-ink)", "var(--gold)", "var(--blue-ink)"];
  return shell("leaderboard", `
  <div class="row between" style="margin-bottom:18px;align-items:flex-end"><div><h1 style="font-size:34px">This week</h1><div class="muted">12–18 October · resets Monday at midnight</div></div><div class="chips hide-m"><span class="chip on" style="padding:7px 13px">This week</span><span class="chip line" style="padding:7px 13px">This month</span><span class="chip line" style="padding:7px 13px">All time</span></div></div>

    </div>
    <div class="grid">
      <div class="card pad"><h3 style="font-size:19px;margin-bottom:10px">How points work</h3>${[["🚀 Launch a project", "+50"], ["✍️ Write a learning", "+15"], ["✅ Answer marked helpful", "+10"], ["💬 Answer a question", "+5"], ["🧩 Add a snippet", "+5"], ["📰 Share an article", "+5 · max 3/wk"], ["💻 Coding day on a linked repo", "+3 · max 15/wk"]].map(([a, p], i) => `<div class="row between small" style="padding:7px 0;${i ? "border-top:1px solid var(--line)" : ""}"><span style="font-weight:700">${a}</span><b>${p}</b></div>`).join("")}<div class="small muted" style="margin-top:8px">Helping and consistency beat volume. Commits count as days, not as numbers.</div></div>

    </div>
  </div>`);
};

pages.share = () => pages.home() + `<div class="scrim"><div class="modal"><div class="opts"><span class="grab" style="display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px"></span><h3 style="font-size:20px;padding:4px 12px 10px">What do you want to add?</h3>
