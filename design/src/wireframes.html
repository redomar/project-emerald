<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emerald wireframes</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1600px; padding: 48px 56px 56px; background: #fafafa; color: var(--wire-ink); }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 26px; border-bottom: 2px solid var(--wire-ink); padding-bottom: 14px; }
  .head h1 { font: 800 40px/1.05 var(--display); margin: 0; letter-spacing: -0.02em; }
  .head .tag { font: 600 15px var(--body); color: #666; }
  .sub { margin: -12px 0 26px; color: #555; font-size: 17px; max-width: 1100px; line-height: 1.45; }

  /* diagram */
  .dia { position: relative; }
  .dia svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
  .n { position: absolute; border: 2px solid var(--wire-ink); background: #fff; border-radius: 10px; padding: 10px 12px; font: 800 16px/1.2 var(--display); text-align: center; display: flex; flex-direction: column; justify-content: center; }
  .n small { display: block; font: 500 12.5px/1.35 var(--body); color: #555; margin-top: 4px; }
  .n.root { background: var(--wire-ink); color: #fff; }
  .n.root small { color: #ddd; }
  .n.key { border-color: var(--emerald); border-width: 2.5px; background: var(--emerald-soft); }
  .n.ext { border-style: dashed; background: transparent; color: #666; }
  .n.dec { border-radius: 4px; transform: none; background: var(--gold-soft); border-color: var(--gold-ink); }
  .n.pt { border-color: var(--gold-ink); background: #fff; }
  .n.group { background: #f0f0f0; border: 1.5px dashed #999; z-index: -1; align-items: flex-start; justify-content: flex-start; font: 800 13px var(--body); text-transform: uppercase; letter-spacing: .06em; color: #777; padding: 8px 12px; text-align: left; }
  .elabel { position: absolute; font: 700 12px var(--body); background: #fafafa; padding: 1px 6px; color: #555; border-radius: 4px; transform: translate(-50%, -50%); white-space: nowrap; }
  .legend { display: flex; gap: 22px; margin-top: 18px; font: 600 14px var(--body); color: #555; }
  .legend span { display: inline-flex; gap: 8px; align-items: center; }
  .legend i { width: 26px; height: 16px; border: 2px solid var(--wire-ink); border-radius: 4px; background: #fff; display: inline-block; }

  /* screen wireframes */
  .wrap { display: grid; grid-template-columns: 1fr 330px; gap: 34px; align-items: start; }
  .browser { border: 2px solid var(--wire-ink); border-radius: 10px; background: #fff; overflow: hidden; }
  .chrome { height: 34px; border-bottom: 2px solid var(--wire-ink); display: flex; align-items: center; gap: 7px; padding: 0 12px; background: #f1f1f1; }
  .chrome i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--wire-ink); }
  .chrome .url { margin-left: 14px; flex: 1; height: 20px; border: 1.5px solid #aaa; border-radius: 99px; font: 500 12px/17px var(--mono); padding: 0 10px; color: #666; background: #fff; }
  .page { padding: 18px 22px 24px; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .nav { display: flex; align-items: center; gap: 18px; font: 700 14px var(--body); padding-bottom: 12px; border-bottom: 1.5px solid #ccc; }
  .nav .logo { font: 800 18px var(--display); margin-right: 16px; white-space: nowrap; }
  .nav .on { text-decoration: underline 3px; text-underline-offset: 6px; }
  .nav .grow { flex: 1; }
  .b { border: 1.8px solid var(--wire-ink); border-radius: 9px; padding: 12px; position: relative; background: #fff; }
  .b.soft { border-color: #aaa; }
  .b h4 { margin: 0 0 6px; font: 800 15px var(--display); }
  .b p { margin: 0; font: 500 12.5px/1.4 var(--body); color: #555; }
  .ph { background: repeating-linear-gradient(45deg, #dedede 0 7px, #ececec 7px 14px); border-radius: 6px; }
  .ln { height: 8px; border-radius: 4px; background: #d2d2d2; margin: 6px 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; font: 800 13px var(--body); padding: 8px 14px; border-radius: 8px; border: 1.8px solid var(--wire-ink); background: #fff; white-space: nowrap; }
  .btn.p { background: var(--wire-ink); color: #fff; }
  .chip { display: inline-block; font: 700 11.5px var(--body); padding: 3px 9px; border-radius: 99px; border: 1.5px solid var(--wire-ink); margin: 2px 3px 2px 0; }
  .av { width: 36px; height: 36px; border-radius: 50%; border: 1.8px solid var(--wire-ink); background: #eee; display: grid; place-items: center; font: 800 13px var(--display); flex: none; }
  .av.lg { width: 76px; height: 76px; font-size: 26px; }
  .row { display: flex; gap: 12px; align-items: center; }
  .col { display: flex; flex-direction: column; gap: 10px; position: relative; }
  .tabs { position: relative; }
  .g { display: grid; gap: 14px; }
  .t { font: 700 13px var(--body); }
  .t small { display: block; font-weight: 500; color: #666; font-size: 12px; }
  .tabs { display: flex; gap: 20px; border-bottom: 1.5px solid #ccc; font: 700 14px var(--body); }
  .tabs span { padding: 8px 0; color: #777; }
  .tabs span.on { color: var(--wire-ink); border-bottom: 3px solid var(--wire-ink); margin-bottom: -1.5px; }
  .fab { position: absolute; width: 54px; height: 54px; border-radius: 50%; background: var(--wire-ink); color: #fff; font: 800 30px/52px var(--display); text-align: center; }
  .code { background: #2b2b2b; color: #ddd; border-radius: 7px; padding: 10px 12px; font: 500 11.5px/1.6 var(--mono); }

  .m { position: absolute; width: 26px; height: 26px; border-radius: 50%; background: var(--emerald); color: #fff; font: 800 13px/26px var(--display); text-align: center; z-index: 3; box-shadow: 0 0 0 3px #fff; }
  .notes { display: flex; flex-direction: column; gap: 14px; }
  .notes div { display: grid; grid-template-columns: 28px 1fr; gap: 10px; font: 500 14px/1.45 var(--body); color: #333; }
  .notes b { display: block; font: 800 15px var(--display); color: var(--wire-ink); margin-bottom: 1px; }
  .notes .k { width: 26px; height: 26px; border-radius: 50%; background: var(--emerald); color: #fff; font: 800 13px/26px var(--display); text-align: center; }
  .notes h3 { font: 800 13px var(--body); text-transform: uppercase; letter-spacing: .08em; color: #777; margin: 0 0 2px; }

  /* mobile */
  .phones { display: flex; gap: 34px; justify-content: center; }
  .ph-w { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ph-w > span { font: 800 16px var(--display); }
  .phone { width: 300px; height: 620px; border: 2.5px solid var(--wire-ink); border-radius: 38px; background: #fff; padding: 40px 14px 0; position: relative; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .phone::before { content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 80px; height: 20px; border-radius: 12px; background: var(--wire-ink); }
  .tabbar { margin: auto -14px 0; border-top: 1.8px solid var(--wire-ink); display: grid; grid-template-columns: repeat(5, 1fr); padding: 8px 0 22px; font: 700 10.5px var(--body); text-align: center; background: #fff; }
  .tabbar span::before { content: ""; display: block; width: 20px; height: 20px; border-radius: 6px; border: 1.8px solid var(--wire-ink); margin: 0 auto 4px; }
  .tabbar .plus::before { background: var(--wire-ink); border-radius: 50%; width: 30px; height: 30px; margin-top: -10px; }
  .tabbar .on { text-decoration: underline 2px; text-underline-offset: 3px; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; border-top: 2px solid var(--wire-ink); border-radius: 22px 22px 0 0; background: #fff; padding: 12px 16px 30px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -400px 0 400px rgba(0,0,0,.25); }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: #aaa; margin: 0 auto 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const which = new URLSearchParams(location.search).get("w") || "01-sitemap";
const root = document.getElementById("root");
const head = (title, tag, sub) => `<div class="head"><h1>${title}</h1><span class="tag">Project Emerald · ${tag}</span></div>${sub ? `<p class="sub">${sub}</p>` : ""}`;

// ---------- diagram engine: absolutely placed nodes + SVG connectors ----------
function diagram({ w, h, nodes, edges }) {
  const html = nodes.map((n) => `<div class="n ${n.c || ""}" id="${n.id}" style="left:${n.x}px;top:${n.y}px;width:${n.w || 190}px;height:${n.h || 64}px">${n.t}${n.s ? `<small>${n.s}</small>` : ""}</div>`).join("");
  return { html: `<div class="dia" style="width:${w}px;height:${h}px">${html}<svg width="${w}" height="${h}"><defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#835c12"/></marker></defs></svg></div>`, edges };
}
function drawEdges(edges) {
  const dia = document.querySelector(".dia"); const svg = dia.querySelector("svg"); const o = dia.getBoundingClientRect();
  const box = (id) => { const r = document.getElementById(id).getBoundingClientRect(); return { l: r.left - o.left, t: r.top - o.top, r: r.right - o.left, b: r.bottom - o.top, cx: (r.left + r.right) / 2 - o.left, cy: (r.top + r.bottom) / 2 - o.top }; };
  for (const e of edges) {
    const [f, t, label, opt = {}] = e; const A = box(f), B = box(t);
    let d, mid;
    const mode = opt.m || "v";
    if (mode === "v") { // bottom → top, elbow
      const y1 = A.b, y2 = B.t, my = opt.y ?? (y1 + y2) / 2;
      d = `M${A.cx},${y1} V${my} H${B.cx} V${y2}`; mid = [B.cx, (my + y2) / 2];
    } else if (mode === "h") { // right → left
      const x1 = A.r, x2 = B.l, mx = (x1 + x2) / 2;
      d = `M${x1},${A.cy} H${mx} V${B.cy} H${x2}`; mid = [mx, (A.cy + B.cy) / 2];
    } else if (mode === "hl") { // left → right (backwards)
      d = `M${A.l},${A.cy} H${B.r}`; mid = [(A.l + B.r) / 2, A.cy];
    } else if (mode === "up") { // top → bottom of target
      const my = opt.y ?? (A.t + B.b) / 2;
      d = `M${A.cx},${A.t} V${my} H${B.cx} V${B.b}`; mid = [B.cx, (my + B.b) / 2];
    } else if (mode === "loop") { // under both, back to target bottom
      const y = opt.y; d = `M${A.cx},${A.b} V${y} H${B.cx} V${B.b}`; mid = [(A.cx + B.cx) / 2, y];
    }
    const gold = opt.gold; const dash = opt.dash ? 'stroke-dasharray="7 6"' : "";
    svg.insertAdjacentHTML("beforeend", `<path d="${d}" fill="none" stroke="${gold ? "#835c12" : "#2b2b2b"}" stroke-width="2" ${dash} marker-end="url(#${gold ? "ag" : "a"})"/>`);
    if (label) dia.insertAdjacentHTML("beforeend", `<span class="elabel" style="left:${mid[0]}px;top:${mid[1]}px">${label}</span>`);
  }
}

  ]});
  root.innerHTML = head("Sitemap", "wire diagram 1 · information architecture",
    "Six top-level sections and one global <b>＋ Add</b> button. Everything a member creates starts from that button, so there's one habit to learn. The calendar stays a separate app and is only linked.")
    + d.html + `<div class="legend"><span><i style="background:var(--emerald-soft);border-color:var(--emerald)"></i>Top-level nav</span><span><i></i>Screen / sub-view</span><span><i style="background:var(--wire-ink)"></i>Entry / action hub</span><span><i style="border-style:dashed"></i>Out of scope (link only)</span></div>`;
  const E = [["in", "home", "", { y: 110 }], ["in", "bld", "", { y: 110 }], ["in", "prj", "", { y: 110 }], ["in", "lrn", "", { y: 110 }], ["in", "snp", "", { y: 110 }], ["in", "lb", "", { y: 110 }],
    ["home", "potm"], ["potm", "feed"], ["feed", "help"], ["bld", "prof"], ["prj", "page"], ["page", "ama"], ["ama", "upd"], ["lrn", "post"], ["snp", "snip"], ["lb", "badges"], ["badges", "pts"]];
  drawEdges(E);
  drawEdges([["add", "a1", "", { m: "h" }], ["add", "a4", "", { m: "h" }]]);
};

    ["b1", "b2", "", { m: "h" }], ["b2", "b3", "", { m: "h" }], ["b3", "b4", "no", { m: "h" }], ["b3", "b3b", "yes"], ["b3b", "b4", "", { m: "h" }], ["b4", "b5", "", { m: "h" }], ["b5", "b6", "", { m: "h", dash: true }],
    ["c1", "c2", "", { m: "h" }], ["c2", "c3", "", { m: "h" }], ["c3", "c4", "", { m: "h" }], ["c4", "c5", "", { m: "h" }], ["c5", "c6", "", { m: "h" }],

const screen = (url, inner, notes) => `<div class="wrap"><div class="browser"><div class="chrome"><i></i><i></i><i></i><span class="url">${url}</span></div><div class="page">${inner}</div></div>
  <div class="notes"><h3>Notes</h3>${notes.map(([t, s], i) => `<div><span class="k">${i + 1}</span><span><b>${t}</b>${s}</span></div>`).join("")}</div></div>`;
