<html lang="en">
<head>
<meta charset="utf-8">
<title>Emerald storyboards</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { width: 1600px; padding: 48px 56px 56px; background: #f6f2e8; }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .head h1 { font: 800 44px/1.05 var(--display); margin: 0; letter-spacing: -0.02em; }
  .head .tag { font: 600 15px var(--body); color: var(--muted); }
  .persona { display: flex; gap: 14px; align-items: center; margin: 14px 0 28px; padding: 14px 18px; background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r); font-size: 17px; }
  .persona .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 700 17px var(--display); color: #fff; background: var(--emerald); flex: none; }
  .persona b { font-weight: 800; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .panel { background: var(--surface); border: 2px solid var(--wire-ink); border-radius: 6px; padding: 16px 18px 18px; position: relative; box-shadow: 5px 5px 0 rgba(0,0,0,.08); }
  .num { position: absolute; top: -14px; left: -14px; width: 34px; height: 34px; border-radius: 50%; background: var(--ink); color: #fff; font: 800 17px var(--display); display: grid; place-items: center; }
  .stage { height: 380px; background: repeating-linear-gradient(0deg, transparent 0 23px, #f1eee6 23px 24px); border-radius: 4px; display: grid; place-items: center; position: relative; overflow: hidden; }
  .cap { margin-top: 14px; }
  .cap h3 { margin: 0 0 4px; font: 800 20px/1.2 var(--display); }
  .cap p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--muted); }

  /* devices */
  .phone { width: 196px; height: 352px; border: 2.5px solid var(--wire-ink); border-radius: 26px; background: #fff; padding: 22px 10px 10px; position: relative; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .phone::before { content: ""; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 54px; height: 6px; border-radius: 4px; background: var(--wire-ink); }
  .laptop { width: 400px; display: flex; flex-direction: column; align-items: center; }
  .laptop .scr { width: 380px; height: 250px; border: 2.5px solid var(--wire-ink); border-radius: 10px 10px 2px 2px; background: #fff; padding: 10px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
  .laptop .base { width: 420px; height: 12px; border: 2.5px solid var(--wire-ink); border-radius: 2px 2px 10px 10px; background: var(--wire-fill); }
  .extra { position: absolute; }

  /* sketch UI */
  .bar { display: flex; align-items: center; justify-content: space-between; font: 800 12px var(--display); padding-bottom: 5px; border-bottom: 1.5px solid var(--wire-mid); }
  .bar i { font-style: normal; width: 16px; height: 16px; border-radius: 50%; background: var(--wire-mid); }
  .hero { background: var(--wire-fill); border: 1.5px solid var(--wire-ink); border-radius: 8px; padding: 8px; font: 800 12px var(--display); }
  .hero small { display: block; font: 500 9.5px var(--body); color: #555; margin-top: 3px; }
  .hero .ph { height: 34px; border-radius: 5px; background: repeating-linear-gradient(45deg, #d6d6d6 0 5px, #e6e6e6 5px 10px); margin-top: 5px; }
  .card { border: 1.5px solid var(--wire-ink); border-radius: 8px; padding: 6px 7px; font: 700 10.5px var(--body); background: #fff; }
  .card small { display: block; font-weight: 500; font-size: 9px; color: #666; margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
  .chip { font: 600 8.5px var(--body); padding: 2px 6px; border-radius: 99px; border: 1.2px solid var(--wire-ink); background: #fff; }
  .row { display: flex; gap: 7px; align-items: center; font: 700 10.5px var(--body); }
  .row small { display: block; font-weight: 500; font-size: 9px; color: #666; }
  .av { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--wire-ink); background: var(--wire-fill); display: grid; place-items: center; font: 800 9px var(--display); flex: none; }
  .btn { text-align: center; font: 800 11px var(--body); padding: 7px; border-radius: 8px; border: 1.5px solid var(--wire-ink); background: #fff; }
  .btn.primary { background: var(--wire-ink); color: #fff; }
  .lines span { display: block; height: 6px; border-radius: 3px; background: var(--wire-mid); margin: 4px 0; }
  .lines span:last-child { width: 62%; }
  .input { border: 1.5px solid var(--wire-ink); border-radius: 7px; padding: 5px 7px; font: 500 9.5px var(--body); color: #333; }
  .input label { display: block; font: 800 8.5px var(--body); text-transform: uppercase; letter-spacing: .04em; color: #777; margin-bottom: 2px; }
  .tabs { display: flex; gap: 4px; font: 700 9.5px var(--body); }
  .tabs span { padding: 3px 7px; border-radius: 99px; border: 1.2px solid var(--wire-mid); color: #666; }
  .tabs span.on { border-color: var(--wire-ink); background: var(--wire-ink); color: #fff; }
  .grid4 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .grid4 .card { text-align: center; padding: 6px 3px; font-size: 9px; }
  .grid4 .av { margin: 0 auto 3px; }
  .toast { border-radius: 8px; padding: 7px 8px; font: 800 10.5px var(--body); background: var(--emerald); color: #fff; display: flex; gap: 6px; align-items: center; }
  .toast.gold { background: var(--gold-soft); color: var(--gold-ink); border: 1.5px solid var(--gold); }
  .medal { margin: 6px auto 2px; width: 92px; height: 92px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #f6dc9a, var(--gold) 70%); border: 3px solid var(--gold-ink); display: grid; place-items: center; font-size: 38px; }
  .center { text-align: center; font: 800 13px var(--display); }
  .center small { display: block; font: 500 9.5px var(--body); color: #666; margin-top: 3px; }
  .modal { position: absolute; inset: auto 8px 8px 8px; border: 2px solid var(--wire-ink); border-radius: 12px; background: #fff; padding: 9px; box-shadow: 0 -40px 0 40px rgba(0,0,0,.18); display: flex; flex-direction: column; gap: 6px; font: 800 11px var(--display); }
  .modal p { margin: 0; font: 500 9.5px/1.35 var(--body); color: #444; }
  .modal .two { display: flex; gap: 5px; }
  .modal .two .btn { flex: 1; font-size: 9.5px; padding: 6px 3px; }
  .lb { display: flex; flex-direction: column; gap: 4px; }
  .lb div { display: flex; justify-content: space-between; align-items: center; font: 700 10px var(--body); padding: 4px 6px; border-radius: 6px; border: 1.2px solid var(--wire-mid); }
  .lb div.you { border: 1.8px solid var(--emerald); background: var(--emerald-soft); }
  .lb b { font-family: var(--display); }
  .notif { display: flex; gap: 6px; align-items: center; border: 1.5px solid var(--wire-ink); border-radius: 10px; padding: 6px 7px; font: 700 9.5px/1.3 var(--body); background: #fff; }
  .wa { background: #e7f6e0; border-radius: 8px 8px 8px 2px; padding: 6px 8px; font: 500 9.5px/1.35 var(--body); max-width: 86%; border: 1.2px solid #bcd9b0; }
  .wa u { color: var(--blue-ink); }
  .code { background: #1f2622; color: #cfe9dc; border-radius: 7px; padding: 6px 7px; font: 500 8.5px/1.5 var(--mono); }
  .spacer { flex: 1; }

  /* highlight + annotation */
  .hl { outline: 2.5px solid var(--emerald); outline-offset: 2px; background: var(--emerald-soft); }
  .btn.primary.hl { background: var(--emerald); border-color: var(--emerald); }
  .tap { position: absolute; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--emerald); background: rgba(15,123,90,.18); pointer-events: none; }
  .note { position: absolute; font: 700 20px/1.05 var(--hand); color: var(--emerald-ink); width: 108px; }
  .note.left { left: 8px; text-align: left; }
  .note.right { right: 8px; text-align: right; }
  .note::after { content: ""; display: block; width: 46px; height: 2px; background: var(--emerald-ink); margin-top: 6px; }
  .note.right::after { margin-left: auto; }
</style>
</head>

  bar: (o) => `<div class="bar">${o.text}<i></i></div>`,
  hero: (o) => `<div class="hero ${o.hl ? "hl" : ""}">${o.text}<small>${o.sub || ""}</small>${o.ph === false ? "" : '<div class="ph"></div>'}</div>`,
  card: (o) => `<div class="card ${o.hl ? "hl" : ""}">${o.title}${o.sub ? `<small>${o.sub}</small>` : ""}${o.chips ? `<div class="chips">${o.chips.map((c) => `<span class="chip">${c}</span>`).join("")}</div>` : ""}</div>`,
  row: (o) => `<div class="row ${o.hl ? "hl" : ""}"><span class="av">${o.av}</span><div>${o.title}<small>${o.sub || ""}</small></div></div>`,
  btn: (o) => `<div class="btn ${o.primary ? "primary" : ""} ${o.hl ? "hl" : ""}">${o.text}</div>`,
  chips: (o) => `<div class="chips">${o.items.map((c, i) => `<span class="chip ${o.on === i ? "hl" : ""}">${c}</span>`).join("")}</div>`,
  lines: (o) => `<div class="lines">${"<span></span>".repeat(o.n || 3)}</div>`,
  input: (o) => `<div class="input ${o.hl ? "hl" : ""}"><label>${o.label}</label>${o.value}</div>`,
  tabs: (o) => `<div class="tabs">${o.items.map((t, i) => `<span class="${i === o.on ? "on" : ""}">${t}</span>`).join("")}</div>`,
  grid: (o) => `<div class="grid4">${o.items.map(([av, n, hl]) => `<div class="card ${hl ? "hl" : ""}"><span class="av">${av}</span>${n}</div>`).join("")}</div>`,
  toast: (o) => `<div class="toast ${o.kind || ""}">${o.text}</div>`,
  medal: (o) => `<div class="medal">${o.icon}</div><div class="center">${o.text}<small>${o.sub}</small></div>`,
  center: (o) => `<div class="center">${o.text}<small>${o.sub || ""}</small></div>`,
  modal: (o) => `<div class="modal">${o.title}<p>${o.body}</p><div class="two">${o.btns.map((b, i) => `<div class="btn ${i === 0 ? "primary hl" : ""}">${b}</div>`).join("")}</div></div>`,
  lb: (o) => `<div class="lb">${o.rows.map(([r, n, p, you]) => `<div class="${you ? "you" : ""}"><span>${r}&nbsp; ${n}</span><b>${p}</b></div>`).join("")}</div>`,
  notif: (o) => `<div class="notif ${o.hl ? "hl" : ""}"><span class="av">${o.av}</span><span>${o.text}</span></div>`,
  wa: (o) => `<div class="wa">${o.text}</div>`,
  code: (o) => `<div class="code">${o.text}</div>`,
  spacer: () => `<div class="spacer"></div>`,
};
const render = (items) => items.map((i) => el[i.t](i)).join("");

function device(p) {
  const taps = (p.taps || []).map(([x, y]) => `<span class="tap" style="left:${x - 15}px;top:${y - 15}px"></span>`).join("");
  const inner = render(p.ui) + taps;
  const body = p.device === "laptop"
    ? `<div class="laptop"><div class="scr">${inner}</div><div class="base"></div></div>`
    : `<div class="phone">${inner}${p.overlay ? render(p.overlay) : ""}</div>`;
  const note = p.note ? `<div class="note ${p.note.side || "left"}" style="top:${p.note.y || 40}px">${p.note.text}</div>` : "";
  return `<div class="stage">${body}${note}</div>`;
}
